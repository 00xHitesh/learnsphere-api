        example: published
        type: string
    type: object
  handler.SetLiveSessionStatusRequest:
    properties:
      status:
        example: published
        type: string
    type: object
  handler.UpdateInterestsRequest:
    properties:
      interests:
        example:
        - Design
        - Programming
