host: localhost:8080
info:
  contact:
    email: support@learnsphere.io
    name: LearnSphere Support
  description: REST API for the LearnSphere e-learning platform
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: LearnSphere API
  version: "1.0"
paths:
  /auth/interests:
    put:
      consumes:
      - application/json
      description: Replace the authenticated user's interest categories
      parameters:
      - description: Interest list
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateInterestsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update interests
      tags:
      - Auth
  /auth/locale:
    put:
      consumes:
      - application/json
      description: Update the authenticated user's region and currency preference
      parameters:
      - description: Locale settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateLocaleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update locale
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password, returns user + JWT token
        pair
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  properties:
                    tokens:
                      $ref: '#/definitions/service.TokenPair'
                    user:
                      $ref: '#/definitions/service.UserResponse'
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login
      tags:
      - Auth
  /auth/me:
    get:
      description: Returns the authenticated user's profile including interests
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account, returns user + JWT token pair
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  properties:
                    tokens:
                      $ref: '#/definitions/service.TokenPair'
                    user:
                      $ref: '#/definitions/service.UserResponse'
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Email already in use
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Set a new password using a valid reset token
      parameters:
      - description: Token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Reset password
      tags:
      - Auth
  /auth/reset-request:
    post:
      consumes:
      - application/json
      description: Send a password-reset token for the given email
      parameters:
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ResetRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  properties:
                    token:
                      type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Request password reset
      tags:
      - Auth
  /chat:
    delete:
      description: Delete all chat messages for the authenticated user, optionally
        scoped to a course
      parameters:
      - description: Scope reset to a course UUID
        in: query
        name: courseId
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reset chat history
      tags:
      - Chat
    get:
      description: Returns chat history for the authenticated user, optionally filtered
        by course
      parameters:
      - description: Filter by course UUID
        in: query
        name: courseId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.ChatMessageResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List chat messages
      tags:
      - Chat
  /chat/messages:
    post:
      consumes:
      - application/json
      description: Add a new message (user or assistant) to the chat history
      parameters:
      - description: Message to append
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AppendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ChatMessageResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Append chat message
      tags:
      - Chat
  /courses:
    get:
      description: Returns all courses with status=published, each with tags
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.CourseResponse'
                  type: array
              type: object
      summary: List published courses
      tags:
      - Courses
    put:
      consumes:
      - application/json
      description: If id is empty a new course is created; otherwise the existing
        course is updated
      parameters:
      - description: Course payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpsertCourseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.CourseResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create or update a course (admin)
      tags:
      - Courses
  /courses/{id}:
    delete:
      description: Permanently deletes a course and its associated enrollments
      parameters:
      - description: Course UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a course (admin)
      tags:
      - Courses
  /courses/{id}/lessons:
    put:
      consumes:
      - application/json
      parameters:
      - description: Course UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LessonResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create or update a lesson (admin)
      tags:
      - Courses
  /courses/{id}/lessons/{lessonId}:
    delete:
      parameters:
      - description: Course UUID
        in: path
        name: id
        required: true
        type: string
      - description: Lesson UUID
        in: path
        name: lessonId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
      security:
      - BearerAuth: []
      summary: Delete a lesson (admin)
      tags:
      - Courses
  /courses/{id}/quiz:
    delete:
      parameters:
      - description: Course UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
      security:
      - BearerAuth: []
      summary: Delete the quiz for a course (admin)
      tags:
      - Courses
    put:
      consumes:
      - application/json
      parameters:
      - description: Course UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.QuizResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create or replace the quiz for a course (admin)
      tags:
      - Courses
  /courses/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update the publication status of a course
      parameters:
      - description: Course UUID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.SetCourseStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.CourseResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set course status (admin)
      tags:
      - Courses
  /courses/{slug}:
    get:
      description: 'Returns a published course with full detail: lessons, reviews,
        quiz'
      parameters:
      - description: Course slug
        example: foundations-of-typescript
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.CourseResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get course by slug
      tags:
      - Courses
  /courses/all:
    get:
      description: Returns every course regardless of status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.CourseResponse'
                  type: array
              type: object
        "401":
