  service.LiveSessionResponse:
    properties:
      courseId:
        type: string
      createdAt:
        type: string
      description:
        type: string
      durationMinutes:
        type: integer
      id:
        type: string
      instructor:
        type: string
      joinUrl:
        type: string
      listPrice:
        type: number
      maxAttendees:
        type: integer
      registeredCount:
        type: integer
      salePrice:
        type: number
      scheduledAt:
        type: string
      status:
        type: string
      title:
        type: string
      topic:
        type: string
      updatedAt:
        type: string
    type: object
  service.OverviewResponse:
    properties:
      revenue:
        type: number
      topCourses:
        items:
          $ref: '#/definitions/service.CourseResponse'
        type: array
      totalCourses:
        type: integer
      totalEnrollments:
        type: integer
      totalUsers:
        type: integer
    type: object
  service.PeriodPoint:
    properties:
      label:
        type: string
      value:
        type: number
    type: object
  service.QuizOptionResponse:
    properties:
      id:
        type: string
      optionKey:
        type: string
      text:
        type: string
    type: object
  service.QuizQuestionResponse:
    properties:
      correctOptionKeys:
        items:
          type: string
        type: array
      explanation:
        type: string
      id:
        type: string
      isMultiSelect:
        type: boolean
      options:
        items:
          $ref: '#/definitions/service.QuizOptionResponse'
        type: array
      prompt:
        type: string
    type: object
  service.QuizResponse:
    properties:
      courseId:
        type: string
      description:
        type: string
      id:
        type: string
      passingScore:
        type: integer
      questions:
        items:
          $ref: '#/definitions/service.QuizQuestionResponse'
        type: array
      title:
        type: string
    type: object
  service.RegionResponse:
    properties:
      code:
        type: string
      defaultCurrencyCode:
        type: string
